<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SpacePop ต้นแบบ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#12385B;--a:#17A7A0;--bg:#F4F7FA;--card:#fff;--tx:#14212e;--mu:#5b6b7b;--ln:#dde5ec;--bad:#c0392b;--ok:#1e8e5a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1822;--card:#16273a;--tx:#e8eef4;--mu:#9bb0c3;--ln:#27415b;--p:#7fb4e6}}
:root[data-theme="dark"]{--bg:#0e1822;--card:#16273a;--tx:#e8eef4;--mu:#9bb0c3;--ln:#27415b;--p:#7fb4e6}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Noto Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--tx);max-width:520px;margin:auto;min-height:100vh;font-size:15px;line-height:1.5}
header{background:#12385B;color:#fff;padding:14px 16px}
header b{font-size:20px}header small{opacity:.8;display:block}
.role{display:flex;gap:6px;margin-top:10px}
.role button{flex:1;padding:7px 2px;border:1px solid #ffffff55;background:transparent;color:#fff;border-radius:8px;font:inherit;font-size:13px}
.role button.on{background:#17A7A0;border-color:#17A7A0}
nav{display:flex;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--ln)}
nav button{flex:none;padding:12px 14px;border:0;background:none;color:var(--mu);font:inherit;border-bottom:3px solid transparent}
nav button.on{color:var(--p);border-color:var(--a);font-weight:600}
main{padding:14px}
.c{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
h2{font-size:18px;margin:4px 0 10px;color:var(--p)}h3{margin:0;font-size:16px}
.mu{color:var(--mu);font-size:13px}
.btn{background:#12385B;color:#fff;border:0;border-radius:9px;padding:9px 14px;font:inherit;font-weight:600}
.btn.a{background:#17A7A0}.btn.o{background:none;color:var(--p);border:1px solid var(--ln)}.btn.r{background:var(--bad)}
.btn:focus-visible,input:focus-visible,select:focus-visible,nav button:focus-visible{outline:3px solid #17A7A0;outline-offset:2px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:9px;font:inherit;background:var(--card);color:var(--tx);margin:4px 0 10px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:#17A7A022;color:var(--a);font-weight:600}
.tag.requested,.tag.pending{background:#e8a31a22;color:#b27700}.tag.confirmed,.tag.approved{background:#1e8e5a22;color:var(--ok)}.tag.rejected,.tag.cancelled{background:#c0392b22;color:var(--bad)}
.thumb{height:84px;border-radius:9px;margin-bottom:8px;background:linear-gradient(135deg,#12385B,#17A7A0);display:flex;align-items:end;padding:8px;color:#fff;font-weight:700}
.days{display:flex;flex-wrap:wrap;gap:6px}
.days button{padding:8px 10px;border-radius:9px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit;font-size:13px}
.days button.on{background:#17A7A0;color:#fff;border-color:#17A7A0}
.stat{flex:1;text-align:center}.stat b{display:block;font-size:22px;color:var(--p)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#12385B;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;max-width:90%}
details{margin-bottom:8px}summary{font-weight:600;color:var(--p);cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}td{border-top:1px solid var(--ln);padding:4px 2px;vertical-align:top}
</style></head><body>
<header><b>SpacePop</b><small>ค้นหาและจองพื้นที่ขายของรายวัน · ต้นแบบทดลองใช้</small>
<div class="role" id="role"></div></header>
<nav id="nav"></nav><main id="app"></main><footer class="mu" style="padding:6px 14px 28px;text-align:center"><a href="#" style="color:var(--p)" onclick="go('terms');return false">ข้อกำหนดการใช้บริการ</a> · <a href="#" style="color:var(--p)" onclick="go('privacy');return false">นโยบายความเป็นส่วนตัว</a></footer><div id="toast"></div>
<script>
const day=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const fm=d=>new Date(d+'T00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short'});
const S={role:'guest',tab:'search',view:null,q:'',area:'',max:'',
spaces:[{id:'SP-001',name:'ลานหน้าห้างเมืองทอง',area:'นนทบุรี',price:600,type:'ตลาดนัด',st:'approved',open:[0,1,2,3,4,5,6]},
{id:'SP-002',name:'ล็อกตลาดนัดสวนจตุจักร',area:'กรุงเทพฯ',price:900,type:'ตลาดนัด',st:'approved',open:[0,2,4,6]},
{id:'SP-003',name:'หน้าคาเฟ่ย่านนิมมาน',area:'เชียงใหม่',price:450,type:'หน้าร้าน',st:'approved',open:[1,2,3,5]},
{id:'SP-004',name:'ลานจอดรถงานอีเวนต์ศรีราชา',area:'ชลบุรี',price:1200,type:'อีเวนต์',st:'pending',open:[0,1,2]}],
bk:[{id:'BK-101',sp:'SP-001',date:day(2),v:'ร้านขนมป้าแดง',st:'requested',log:[['requested','ร้านขนมป้าแดง']]},
{id:'BK-102',sp:'SP-002',date:day(3),v:'ร้านขนมป้าแดง',st:'confirmed',log:[['requested','ร้านขนมป้าแดง'],['confirmed','เจ้าของพื้นที่']]}],
rp:[],n:103,ed:null,hv:[{id:'HV-1',name:'คุณสมชาย ใจดี',st:'pending'}],users:[{n:'ร้านขนมป้าแดง',r:'ผู้ค้า'},{n:'คุณสมชาย ใจดี',r:'เจ้าของพื้นที่'},{n:'ทีมแอดมิน',r:'แอดมิน'}]};
const sp=id=>S.spaces.find(s=>s.id==id);
function toast(t){const e=document.getElementById('toast');e.innerHTML='<div class="toast">'+t+'</div>';setTimeout(()=>e.innerHTML='',2400)}
function go(t,v){S.tab=t;S.view=v||null;draw()}
function setRole(r){S.role=r;S.view=null;S.tab=TABS[r][0][0];draw()}
const TABS={guest:[['search','ค้นหา'],['login','เข้าสู่ระบบ'],['hreg','เป็นเจ้าของพื้นที่'],['db','โครงสร้างข้อมูล']],
vendor:[['search','ค้นหา'],['mine','การจองของฉัน'],['hreg','เป็นเจ้าของพื้นที่'],['db','โครงสร้างข้อมูล']],
host:[['reqs','คำขอจอง'],['dash','แดชบอร์ด'],['edit','ลงประกาศ'],['cal','ปฏิทินวันว่าง'],['db','โครงสร้างข้อมูล']],
admin:[['appr','อนุมัติประกาศ'],['abk','การจอง'],['rev','รายได้'],['usr','ผู้ใช้'],['rep','ข้อร้องเรียน'],['db','โครงสร้างข้อมูล']]};
const RN={guest:'ผู้เยี่ยมชม',vendor:'ผู้ค้า',host:'เจ้าของพื้นที่',admin:'แอดมิน'};
function draw(){
document.getElementById('role').innerHTML=Object.keys(RN).map(r=>`<button class="${S.role==r?'on':''}" onclick="setRole('${r}')">${RN[r]}</button>`).join('');
document.getElementById('nav').innerHTML=TABS[S.role].map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
document.getElementById('app').innerHTML=(V[S.view?S.view[0]:S.tab]||V.search)(S.view&&S.view[1]);}
const tag=s=>`<span class="tag ${s}">${{requested:'รอตอบรับ',confirmed:'ยืนยันแล้ว',rejected:'ปฏิเสธ',cancelled:'ยกเลิก',pending:'รออนุมัติ',approved:'เผยแพร่แล้ว',open:'เปิดอยู่'}[s]||s}</span>`;
function listCard(s){return `<div class="c"><div class="thumb">${s.type}</div><div class="row"><h3>${s.name}</h3><b>฿${s.price}</b></div><div class="mu">${s.area} · ต่อวัน</div><button class="btn a" style="margin-top:8px" onclick="go('${S.tab}',['detail','${s.id}'])">ดูรายละเอียด</button></div>`}
const V={
search(){const l=S.spaces.filter(s=>s.st=='approved'&&(!S.area||s.area==S.area)&&(!S.max||s.price<=+S.max)&&s.name.includes(S.q));
return `<h2>ค้นหาพื้นที่ขายของ</h2><input placeholder="ค้นหาชื่อพื้นที่" value="${S.q}" oninput="S.q=this.value;draw();document.querySelector('main input').focus()">
<div class="row"><select onchange="S.area=this.value;draw()"><option value="">ทุกจังหวัด</option>${['กรุงเทพฯ','นนทบุรี','เชียงใหม่'].map(a=>`<option ${S.area==a?'selected':''}>${a}</option>`).join('')}</select>
<select onchange="S.max=this.value;draw()"><option value="">ทุกราคา</option><option value="500" ${S.max==500?'selected':''}>ไม่เกิน ฿500</option><option value="1000" ${S.max==1000?'selected':''}>ไม่เกิน ฿1,000</option></select></div>
<p class="mu">พบ ${l.length} พื้นที่</p>${l.map(listCard).join('')||'<div class="c">ไม่พบพื้นที่ ลองเปลี่ยนตัวกรอง</div>'}`},
detail(id){const s=sp(id);return `<button class="btn o" onclick="go('${S.tab}')">กลับ</button><div class="c" style="margin-top:10px"><div class="thumb">${s.type}</div><h2>${s.name}</h2><p>${s.area} · ฿${s.price} ต่อวัน</p><p class="mu">ชำระเงินกับเจ้าของพื้นที่โดยตรง SpacePop ไม่รับเงินค่าเช่า</p><b>วันที่เปิดให้เช่า</b><div class="days" style="margin:8px 0 12px">${s.open.map(n=>`<span class="tag">${fm(day(n))}</span>`).join('')}</div><button class="btn a" onclick="${S.role=='vendor'?`go('search',['form','${id}'])`:`toast('กรุณาเข้าสู่ระบบเป็นผู้ค้าก่อนส่งคำขอ');setRole('vendor')`}">ขอจองพื้นที่</button></div>`},
form(id){const s=sp(id);return `<h2>ส่งคำขอจอง</h2><div class="c"><b>${s.name}</b><label class="mu">เลือกวันที่</label><select id="fd">${s.open.map(n=>`<option value="${day(n)}">${fm(day(n))}</option>`).join('')}</select><label class="mu">สินค้าที่จะขาย</label><input id="fn" placeholder="เช่น ขนมไทย"><label><input type="checkbox" id="fa" style="width:auto"> ฉันยอมรับข้อกำหนดการใช้บริการและนโยบายความเป็นส่วนตัว</label><br><br><button class="btn a" onclick="sendBk('${id}')">ส่งคำขอ</button> <button class="btn o" onclick="go('search',['detail','${id}'])">ยกเลิก</button></div>`},
login(){return `<h2>เข้าสู่ระบบ / สมัครสมาชิก</h2><div class="c"><label class="mu">ชื่อร้าน</label><input><label class="mu">อีเมล</label><input type="email"><button class="btn a" onclick="setRole('vendor')">สมัครเป็นผู้ค้า</button><p class="mu">หรือทดลองด้วยบัญชีทดสอบ</p>${['vendor','host','admin'].map(r=>`<button class="btn ${r=='vendor'?'a':''}" style="margin:0 6px 6px 0" onclick="setRole('${r}')">เข้าเป็น${RN[r]}</button>`).join('')}</div>`},
mine(){const l=S.bk.filter(b=>b.v=='ร้านขนมป้าแดง');return `<h2>การจองของฉัน</h2>${l.map(b=>`<div class="c"><div class="row"><b>${sp(b.sp).name}</b>${tag(b.st)}</div><div class="mu">${fm(b.date)} · ${b.id}</div><button class="btn o" style="margin-top:8px" onclick="go('mine',['bd','${b.id}'])">รายละเอียด</button></div>`).join('')||'<div class="c">ยังไม่มีการจอง ไปค้นหาพื้นที่แรกของคุณ</div>'}`},
bd(id){const b=S.bk.find(x=>x.id==id);return `<button class="btn o" onclick="go('mine')">กลับ</button><div class="c" style="margin-top:10px"><div class="row"><h3>${sp(b.sp).name}</h3>${tag(b.st)}</div><p>${fm(b.date)} · ${b.id}</p><b>ประวัติสถานะ</b>${b.log.map(l=>`<div class="mu">• ${l[0]} โดย ${l[1]}</div>`).join('')}<div style="margin-top:12px">${['requested','confirmed'].includes(b.st)?`<button class="btn r" onclick="setSt('${b.id}','cancelled','ผู้ค้า');go('mine')">ยกเลิกการจอง</button> `:''}<button class="btn o" onclick="S.rp.push({id:'RP-'+(S.rp.length+1),bk:'${b.id}',st:'open'});toast('ส่งข้อร้องเรียนแล้ว')">แจ้งข้อร้องเรียน</button></div></div>`},
reqs(){const l=S.bk.filter(b=>b.st=='requested');return `<h2>คำขอจองของพื้นที่คุณ</h2>${l.map(b=>`<div class="c"><b>${sp(b.sp).name}</b><div class="mu">${b.v} · ${fm(b.date)}</div><div style="margin-top:8px"><button class="btn a" onclick="accept('${b.id}')">ตอบรับ</button> <button class="btn r" onclick="setSt('${b.id}','rejected','เจ้าของพื้นที่');draw()">ปฏิเสธ</button></div></div>`).join('')||'<div class="c">ไม่มีคำขอใหม่</div>'}`},
dash(){const c=s=>S.bk.filter(b=>b.st==s).length;return `<h2>แดชบอร์ดเจ้าของพื้นที่</h2><div class="c row"><div class="stat"><b>${c('requested')}</b>รอตอบรับ</div><div class="stat"><b>${c('confirmed')}</b>ยืนยันแล้ว</div><div class="stat"><b>฿${S.bk.filter(b=>b.st=='confirmed').reduce((a,b)=>a+sp(b.sp).price,0)}</b>รายได้โดยประมาณ</div></div><p class="mu">เจ้าของพื้นที่เก็บเงินจากผู้ค้าโดยตรง ตัวเลขนี้เป็นเพียงการประมาณ</p>`},
cal(){const s=sp('SP-001');return `<h2>ปฏิทินวันว่าง · ${s.name}</h2><div class="c"><p class="mu">แตะเพื่อเปิดหรือปิดวัน</p><div class="days">${[0,1,2,3,4,5,6].map(n=>`<button class="${s.open.includes(n)?'on':''}" onclick="tg(${n})">${fm(day(n))}</button>`).join('')}</div></div>`},
appr(){return `<h2>อนุมัติประกาศ</h2>${S.spaces.map(s=>`<div class="c"><div class="row"><b>${s.name}</b>${tag(s.st)}</div><div class="mu">${s.area} · ฿${s.price}</div>${s.st=='pending'?`<div style="margin-top:8px"><button class="btn a" onclick="sp('${s.id}').st='approved';toast('อนุมัติแล้ว');draw()">อนุมัติ</button> <button class="btn r" onclick="sp('${s.id}').st='rejected';draw()">ไม่อนุมัติ</button></div>`:''}</div>`).join('')}`},
abk(){return `<h2>การจองทั้งหมด</h2>${S.bk.map(b=>`<div class="c row"><div><b>${b.id}</b><div class="mu">${sp(b.sp).name} · ${fm(b.date)}</div></div>${tag(b.st)}</div>`).join('')}`},
rep(){return `<h2>ข้อร้องเรียน</h2>${S.rp.map(r=>`<div class="c row"><div><b>${r.id}</b><div class="mu">เกี่ยวกับ ${r.bk}</div></div>${tag(r.st=='open'?'requested':'confirmed')}${r.st=='open'?`<button class="btn a" onclick="S.rp.find(x=>x.id=='${r.id}').st='done';draw()">ปิดเรื่อง</button>`:''}</div>`).join('')||'<div class="c">ยังไม่มีข้อร้องเรียน ผู้ค้าแจ้งได้จากหน้ารายละเอียดการจอง</div>'}`},
hreg(){return `<h2>สมัครเป็นเจ้าของพื้นที่</h2><div class="c"><label class="mu">ชื่อ-นามสกุล</label><input id="hn"><label class="mu">เบอร์โทร</label><input id="hp" type="tel"><label class="mu">เอกสารยืนยันตัวตน</label><input type="file"><p class="mu">เอกสารเห็นได้เฉพาะแอดมิน ไม่เปิดเผยให้ผู้ใช้อื่น</p><button class="btn a" onclick="sendHv()">ส่งใบสมัคร</button></div>${S.hv.filter(h=>h.mine).map(h=>`<div class="c row">ใบสมัครของคุณ ${tag(h.st)}</div>`).join('')}`},
edit(){const s=sp(S.ed)||{};return `<h2>${S.ed?'แก้ไขประกาศ':'ลงประกาศพื้นที่ใหม่'}</h2><div class="c"><label class="mu">ชื่อพื้นที่</label><input id="en" value="${s.name||''}"><label class="mu">จังหวัด</label><input id="ea" value="${s.area||''}"><label class="mu">ราคาต่อวัน (บาท)</label><input id="ep" type="number" value="${s.price||''}"><label class="mu">ประเภท</label><select id="et">${['ตลาดนัด','หน้าร้าน','อีเวนต์'].map(t=>`<option ${s.type==t?'selected':''}>${t}</option>`).join('')}</select><p class="mu">ประกาศใหม่และที่แก้ไขต้องรอแอดมินอนุมัติก่อนเผยแพร่</p><button class="btn a" onclick="saveSp()">บันทึกและส่งอนุมัติ</button> ${S.ed?`<button class="btn o" onclick="S.ed=null;draw()">ลงประกาศใหม่แทน</button>`:''}</div><h3>พื้นที่ของฉัน</h3>${S.spaces.map(x=>`<div class="c row"><div><b>${x.name}</b><div class="mu">฿${x.price}</div></div>${tag(x.st)}<button class="btn o" onclick="S.ed='${x.id}';draw()">แก้ไข</button></div>`).join('')}`},
rev(){const f=S.bk.filter(b=>b.st=='confirmed'),fee=b=>Math.round(sp(b.sp).price*.1);return `<h2>รายได้และใบแจ้งหนี้</h2><div class="c row"><div class="stat"><b>฿${f.reduce((a,b)=>a+fee(b),0)}</b>ค่าบริการรวม</div><div class="stat"><b>${f.length}</b>ใบแจ้งหนี้</div></div><p class="mu">ตัวอย่างคิดค่าบริการ 10% ต่อการจองที่ยืนยัน ผู้ค้าจ่ายค่าเช่ากับเจ้าของพื้นที่โดยตรง</p>${f.map(b=>`<div class="c row"><div><b>INV-${b.id.slice(3)}</b><div class="mu">${sp(b.sp).name} · ${fm(b.date)}</div></div><b>฿${fee(b)}</b></div>`).join('')||'<div class="c">ยังไม่มีการจองที่ยืนยัน</div>'}`},
usr(){return `<h2>ผู้ใช้และการยืนยันตัวตน</h2>${S.users.map(u=>`<div class="c row"><b>${u.n}</b><span class="tag">${u.r}</span></div>`).join('')}<h3>ใบสมัครเจ้าของพื้นที่</h3>${S.hv.map(h=>`<div class="c row"><b>${h.name}</b>${tag(h.st)}${h.st=='pending'?`<button class="btn a" onclick="S.hv.find(x=>x.id=='${h.id}').st='approved';draw()">อนุมัติ</button>`:''}</div>`).join('')}<p class="mu">ข้อร้องเรียนที่เปิดอยู่ ${S.rp.filter(r=>r.st=='open').length} เรื่อง</p>`},
terms(){return `<h2>ข้อกำหนดการใช้บริการ</h2><div class="c mu">1. SpacePop เป็นตัวกลางเชื่อมเจ้าของพื้นที่กับผู้ค้า ไม่รับชำระค่าเช่า<br>2. การจองสำเร็จเมื่อเจ้าของพื้นที่ตอบรับและผู้ค้ายอมรับข้อตกลงครบ<br>3. ผู้ใช้ต้องให้ข้อมูลจริง และประกาศต้องผ่านการอนุมัติก่อนเผยแพร่<br>4. ยกเลิกการจองและแจ้งข้อร้องเรียนได้จากหน้ารายละเอียดการจอง<br>5. แอดมินระงับบัญชีที่ละเมิดข้อกำหนดได้<br><br>ฉบับตัวอย่าง ควรให้ผู้เชี่ยวชาญด้านกฎหมายตรวจก่อนใช้จริง</div>`},
privacy(){return `<h2>นโยบายความเป็นส่วนตัว</h2><div class="c mu">1. เก็บข้อมูลเท่าที่จำเป็น เช่น ชื่อ อีเมล เบอร์โทร และประวัติการจอง<br>2. เอกสารยืนยันตัวตนเห็นได้เฉพาะแอดมิน ไม่เปิดเผยระหว่างบัญชี<br>3. เจ้าของพื้นที่เห็นข้อมูลติดต่อผู้ค้าเฉพาะการจองของตนเอง<br>4. ขอดู แก้ไข หรือลบข้อมูลได้ตามสิทธิใน พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล<br><br>ฉบับตัวอย่าง ควรให้ผู้เชี่ยวชาญด้านกฎหมายตรวจก่อนใช้จริง</div>`},
db(){const T=[['users','user_id, name, email, phone, role (Vendor/Host/Admin), created_at'],
['spaces','space_id, host_id→users, title, province, address, price_thb, type, description, status (draft/pending/approved/rejected), approved_by→users'],
['space_photos','photo_id, space_id→spaces, image, sort_order'],
['availability','avail_id, space_id→spaces, date, is_open, price_override, slot_key (space_id+date)'],
['bookings','booking_id, space_id→spaces, vendor_id→users, date, status (requested/confirmed/rejected/cancelled), terms_accepted, confirm_key'],
['booking_history','history_id, booking_id→bookings, from_status, to_status, changed_by→users, changed_at'],
['hosts_verification','verify_id, host_id→users, id_document (ส่วนตัว), status, reviewed_by→users'],
['invoices','invoice_id, booking_id→bookings, host_id→users, fee_thb, period, status'],
['reports','report_id, booking_id→bookings, reporter_id→users, reason, status, resolved_by→users']];
return `<h2>โครงสร้าง Airtable 9 ตาราง</h2>${T.map(t=>`<details class="c"><summary>${t[0]}</summary><p class="mu">${t[1]}</p></details>`).join('')}
<div class="c"><b>กฎสำคัญ</b><p class="mu">• confirm_key = space_id + วันที่ ใส่เฉพาะตอนสถานะ confirmed ใช้ automation ตรวจซ้ำก่อนยืนยัน<br>• ทุกครั้งที่เปลี่ยนสถานะ automation เพิ่มแถวใน booking_history<br>• Softr: จำกัดข้อมูลตามผู้ใช้และกลุ่มผู้ใช้ แยกเอกสารยืนยันตัวตนให้เห็นเฉพาะแอดมิน</p></div>`}};
function sendBk(id){if(!document.getElementById('fa').checked){toast('กรุณายอมรับข้อกำหนดก่อน');return}
const b={id:'BK-'+S.n++,sp:id,date:document.getElementById('fd').value,v:'ร้านขนมป้าแดง',st:'requested',log:[['requested','ร้านขนมป้าแดง']]};S.bk.push(b);toast('ส่งคำขอแล้ว รอเจ้าของพื้นที่ตอบรับ');go('mine')}
function setSt(id,st,by){const b=S.bk.find(x=>x.id==id);b.st=st;b.log.push([st,by])}
function accept(id){const b=S.bk.find(x=>x.id==id);if(S.bk.some(x=>x.id!=id&&x.st=='confirmed'&&x.sp==b.sp&&x.date==b.date)){toast('ไม่สามารถยืนยันได้ มีการจองที่ยืนยันแล้วในวันนี้');return}setSt(id,'confirmed','เจ้าของพื้นที่');toast('ตอบรับแล้ว');draw()}
function sendHv(){S.hv.push({id:'HV-'+(S.hv.length+1),name:document.getElementById('hn').value||'ผู้สมัครใหม่',st:'pending',mine:1});toast('ส่งใบสมัครแล้ว รอแอดมินตรวจสอบ');draw()}
function saveSp(){const g=i=>document.getElementById(i).value,n=g('en');if(!n){toast('กรุณากรอกชื่อพื้นที่');return}const o={name:n,area:g('ea'),price:+g('ep')||0,type:g('et'),st:'pending'};if(S.ed)Object.assign(sp(S.ed),o);else S.spaces.push({id:'SP-00'+(S.spaces.length+1),open:[0,1,2],...o});S.ed=null;toast('ส่งให้แอดมินอนุมัติแล้ว');draw()}
function tg(n){const s=sp('SP-001'),i=s.open.indexOf(n);i<0?s.open.push(n):s.open.splice(i,1);draw()}
draw();
</script></body></html>
